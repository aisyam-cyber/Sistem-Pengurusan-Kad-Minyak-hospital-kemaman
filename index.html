<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pengurusan Kad Minyak - Hospital Kemaman</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="bg-blue-900 text-white p-6 rounded-lg shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">HOSPITAL KEMAMAN</h1>
        <p class="text-blue-200 text-sm">Sistem Pengurusan & Rekod Transaksi Kad Minyak</p>
      </div>
      <button onclick="loadData()" class="mt-4 md:mt-0 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-md font-semibold transition">
        🔄 Muat Semula Data
      </button>
    </header>

    <!-- Status Loading -->
    <div id="loading" class="text-center py-10">
      <p class="text-gray-600 font-medium">Sedang memuatkan pangkalan data...</p>
    </div>

    <!-- Content Tabs Area -->
    <div id="content" class="hidden space-y-8">
      <!-- Section: Rekod Transaksi -->
      <section class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">⛽ Rekod Transaksi Minyak Terkini</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm" id="table-Rekod_Transaksi"></table>
        </div>
      </section>

      <!-- Section: Kad Minyak -->
      <section class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">💳 Senarai Kad Minyak</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm" id="table-Kad_Minyak"></table>
        </div>
      </section>
    </div>
  </div>

  <script>
    // GANTIKAN URL DI BAWAH DENGAN GOOGLE APPS SCRIPT WEB APP URL ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbwnmB-Cb8Frt6zg7zESQcHhXmnGe0hzu8OQO5SSKe3yl8kq58jh_piZ91T_KTG7pFlFwQ/exec";

    async function loadData() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');

      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        renderTable("table-Rekod_Transaksi", data["Rekod_Transaksi"]);
        renderTable("table-Kad_Minyak", data["Kad_Minyak"]);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } catch (err) {
        alert("Gagal memuatkan data. Pastikan URL API adalah betul dan telah di-deploy dengan kebenaran 'Anyone'.");
        console.error(err);
      }
    }

    function renderTable(tableId, gridData) {
      const table = document.getElementById(tableId);
      table.innerHTML = "";

      if (!gridData || gridData.length === 0) return;

      // Header
      let thead = `<thead class="bg-slate-100 text-gray-700 font-semibold"><tr>`;
      gridData[0].forEach(col => thead += `<th class="p-3 border-b">${col}</th>`);
      thead += `</tr></thead>`;

      // Body
      let tbody = `<tbody>`;
      for (let i = 1; i < gridData.length; i++) {
        tbody += `<tr class="border-b hover:bg-slate-50">`;
        gridData[i].forEach(cell => tbody += `<td class="p-3">${cell}</td>`);
        tbody += `</tr>`;
      }
      tbody += `</tbody>`;

      table.innerHTML = thead + tbody;
    }

    // Auto-load bila buka web
    loadData();
  </script>
</body>
</html>
